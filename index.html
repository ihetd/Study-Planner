/* ============================ FOCUS MODE ============================ */
// When زهرة studies, the Peony fills the screen: the ring fills every 25 minutes
// and the flower opens a little more as it does.
const Focus = {
  open: false, cycle: -1, msgAt: 0, CYCLE: 25 * 60e3, RING: 289.03,
  lines: ['Breathe… one page at a time 🌱', "I'm right here with you 🌸", 'Focus now, rest soon ☕', 'Every minute counts 💜', 'You are doing amazing 🌷', 'Sip some water 💧'],
  show() {
    if (S.me !== 'zhra' || !liveOf('zhra')) return;
    this.open = true; $('#focus').hidden = false; document.body.style.overflow = 'hidden';
    if (!$('#fxArt').firstChild) $('#fxArt').innerHTML = peonySVG({ face: true });
    if (!$('#focus .fx-petal')) this.sky();
    Peony.el.hidden = true; this.cycle = -1; this.update(); this.say();
  },
  hide() {
    this.open = false; $('#focus').hidden = true; document.body.style.overflow = '';
    Peony.el.hidden = !Peony.active;
  },
  sky() {
    if (reduceMotion) return;
    const colors = ['#d4b0f0', '#f4a3c8', '#b57edc', '#ffffff', '#e2c6f5'], sky = $('#focus .fx-sky');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('i'); p.className = 'fx-petal';
      p.style.cssText = `left:${Math.random() * 100}%;background:${colors[i % colors.length]};--sx:${(Math.random() - .5) * 160}px;--sr:${Math.random() * 720 - 360}deg;animation-duration:${10 + Math.random() * 10}s;animation-delay:${-Math.random() * 20}s;transform:scale(${.6 + Math.random() * .7})`;
      sky.append(p);
    }
  },
  update() {
    const x = S.me === 'zhra' && liveOf('zhra');
    if (!x) { if (this.open) this.hide(); return; }
    if (!this.open) return;
    $('#focus').classList.toggle('paused', !!x.pausedAt);
    $('#fxSubj').textContent = x.subject ? `${x.subject} #${x.seq}` : 'Free session';
    $('#fxPause').textContent = x.pausedAt ? '▶ Resume' : '❚❚ Pause';
    $('#fxDone').hidden = !x.lectureId;
    if (x.pausedAt) $('#fxMsg').textContent = 'Paused… I’ll wait for you 😴';
    this.tick();
  },
  say() { const x = liveOf('zhra'); if (x && !x.pausedAt) $('#fxMsg').textContent = this.lines[Math.floor(Math.random() * this.lines.length)]; this.msgAt = Date.now(); },
  tick() {
    if (!this.open) return;
    const x = liveOf('zhra'); if (!x) return;
    const ms = elapsed(x), cycles = Math.floor(ms / this.CYCLE), p = (ms % this.CYCLE) / this.CYCLE;
    $('#fxClock').innerHTML = clockHtml(ms);
    $('#fxRing').style.strokeDashoffset = this.RING * (1 - p);
    // the flower opens as the 25 minutes fill up
    const sc = (a, b) => `scale(${(a + (b - a) * p).toFixed(3)})`;
    const art = $('#fxArt');
    $$('.po', art).forEach(g => g.style.transform = sc(.82, 1.08));
    $$('.pm', art).forEach(g => g.style.transform = sc(.86, 1.06));
    $$('.pi', art).forEach(g => g.style.transform = sc(.9, 1.04));
    $('#fxBlooms').textContent = cycles ? `${'🌸'.repeat(Math.min(cycles, 8))}  ${plural(cycles, 'bloom')}` : 'Your flower blooms every 25 minutes';
    if (this.cycle >= 0 && cycles > this.cycle) {
      $('#focus').classList.add('happy'); setTimeout(() => $('#focus').classList.remove('happy'), 3000);
      const r = $('#fxArt').getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 30);
      $('#fxMsg').textContent = `${cycles * 25} minutes! A 5-minute break? ☕🌸`; this.msgAt = Date.now();
    } else if (!x.pausedAt && Date.now() - this.msgAt > 4 * 60e3) this.say();
    this.cycle = cycles;
  }
};

/* ============================ PEONY ============================ */
const Peony = {
  el: $('#peony'), bubble: $('#bubble'), timer: null, msgIdx: 0, active: false,
  show(on) {
    this.active = on; this.el.hidden = !on || Focus.open;
    if (on) {
      const pos = ls.get('sp.peonyPos', null);
      if (pos) this.place(pos.x, pos.y);
      setTimeout(() => this.say(this.greeting()), 900);
    }
  },
  mood() { return stats(Store.all().filter(l => l.owner === 'zhra')); },
  refresh() {
    if (!this.active) return;
    const st = this.mood();
    this.el.classList.toggle('sleepy', st.overdue && st.overdue.length > 5);
  },
  greeting() {
    const st = this.mood(), h = new Date().getHours();
    const dated = Phrases.list.filter(p => p.date === todayStr());
    if (dated.length) return fillPhrase(dated[Math.floor(Math.random() * dated.length)].text, st);
    const hi = h < 12 ? 'Good morning' : h < 18 ? 'Hi' : 'Good evening';
    if (!st.total) return `${hi} ${isoName('zhra')}! Paste the schedule and I'll keep track 💜`;
    if (st.overdue.length > 5) return `${st.overdue.length} lectures are waiting… just one small one? 🥺`;
    if (st.todayLeft) return `${hi} ${isoName('zhra')}! ${plural(st.todayLeft, 'lecture')} left today 🌸`;
    if (st.today.length) return `Today is all done! I'm blooming 🌸`;
    return `${hi} ${isoName('zhra')}! Nothing due today. Revise something? 💜`;
  },
  lines() {
    const st = this.mood(), out = [this.greeting()];
    // Admin phrases come first (today's dated ones plus any-day ones), then the built-ins.
    Phrases.list.filter(p => !p.date || p.date === todayStr()).forEach(p => out.push(fillPhrase(p.text, st)));
    if (st.streak > 1) out.push(`${st.streak}-day streak! Keep it going 🔥`);
    if (st.overdue && st.overdue.length && st.overdue.length <= 5) out.push(`Only ${st.overdue.length} left from before, you can do it 💪`);
    out.push('Small steps every day 🌱', 'Water first, then one more lecture 💧', `Proud of you, ${isoName('zhra')} 💜`, 'Peonies bloom slowly too 🌸', 'Take a 5 minute break, then back to it ☕');
    return out;
  },
  say(text, ms = 3800) {
    this.bubble.textContent = text; this.bubble.classList.add('show');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.bubble.classList.remove('show'), ms);
  },
  bloom(happy = true) {
    this.el.classList.add('bloom'); if (happy) this.el.classList.add('happy');
    setTimeout(() => this.el.classList.remove('bloom'), 650);
    setTimeout(() => this.el.classList.remove('happy'), 1800);
  },
  tap() {
    const lines = this.lines();
    this.msgIdx = (this.msgIdx + 1) % lines.length;
    this.bloom(); this.say(lines[this.msgIdx]);
    this.confetti(6);
  },
  celebrate(kind, subject) {
    if (!this.active) return toast(`${subject} studied ✔`);
    this.bloom();
    if (kind === 'big') { this.say('Everything for today is done! 🎉🌸', 5000); this.confetti(40); }
    else { this.say(`Yay! ${subject} done 🌸`); this.confetti(14); }
  },
  confetti(n) {
    const r = this.el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 40, n);
  },
  place(x, y) {
    const w = this.el.offsetWidth || 96, h = this.el.offsetHeight || 120;
    x = Math.max(4, Math.min(innerWidth - w - 4, x)); y = Math.max(4, Math.min(innerHeight - h - 4, y));
    Object.assign(this.el.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
    this.el.classList.toggle('left', x < innerWidth / 2 - w / 2);
    return { x, y };
  }
};
(() => {
  const btn = $('#peony .pbtn');
  let start = null, moved = false;
  btn.addEventListener('pointerdown', e => {
    const r = Peony.el.getBoundingClientRect();
    start = { px: e.clientX, py: e.clientY, x: r.left, y: r.top }; moved = false;
    btn.setPointerCapture(e.pointerId);
  });
  btn.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = e.clientX - start.px, dy = e.clientY - start.py;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true; Peony.el.classList.add('dragging');
    Peony.place(start.x + dx, start.y + dy);
  });
  btn.addEventListener('pointerup', () => {
    if (moved) { const r = Peony.el.getBoundingClientRect(); ls.set('sp.peonyPos', { x: r.left, y: r.top }); }
    Peony.el.classList.remove('dragging'); start = null;
  });
  btn.addEventListener('click', e => { if (moved) { moved = false; e.preventDefault(); return; } Peony.tap(); });
  addEventListener('resize', () => { const p = ls.get('sp.peonyPos', null); if (p && Peony.active) Peony.place(p.x, p.y); });
})();

/* ============================ INSTALL AS APP ============================ */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;   // Android / desktop Chrome hand us a real install prompt
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; refreshInstallUI(); });
addEventListener('appinstalled', () => { installPrompt = null; ls.set('sp.installDismissed', true); refreshInstallUI(); toast('Installed 🌸'); });
const canInstall = () => !isStandalone() && (isIOS || !!installPrompt);
function refreshInstallUI() {
  $('#installLink').hidden = !canInstall();
  if (S.me && S.tab === 'today') renderToday();
}
const SHARE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
const ADD_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
async function installApp() {
  if (installPrompt) { installPrompt.prompt(); const r = await installPrompt.userChoice; if (r.outcome === 'accepted') installPrompt = null; return refreshInstallUI(); }
  showPop(`<h3>📲 Install Study Planner</h3>
    <p class="meta">It opens full screen from your home screen, with the Peony icon, like a normal app.</p>
    <ol class="steps">
      <li><span>Open this page in <b>Safari</b></span></li>
      <li><span>Tap ${SHARE_ICON} <b>Share</b> at the bottom</span></li>
      <li><span>Scroll and tap ${ADD_ICON} <b>Add to Home Screen</b></span></li>
      <li><span>Tap <b>Add</b>. Done 🌸</span></li>
    </ol>`);
}
function installCard() {
  if (!canInstall() || ls.get('sp.installDismissed', false)) return '';
  return `<div class="install"><img src="assets/icon-192.png" alt="">
    <div><b>Install the app</b>${isIOS ? 'Add Study Planner to your home screen' : 'Open it like a real app, full screen'}</div>
    <button class="btn sm" type="button" data-install>${isIOS ? 'How' : 'Install'}</button>
    <button class="x" type="button" data-install-dismiss aria-label="Hide">✕</button></div>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-install], #installLink')) installApp();
  if (e.target.closest('[data-install-dismiss]')) { ls.set('sp.installDismissed', true); renderToday(); }
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ============================ AUTH / BOOT ============================ */
let pickedUser = null;

// Admin PIN (local mode): locks Hussein's profile, and with it the ⚙ phrases page.
// Only a salted SHA-256 of the PIN is stored, on this device. The device stays
// trusted after a correct PIN until Hussein switches user (⇄).
const PIN_SALT = 'study-planner/admin/v1:';
async function pinHash(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(PIN_SALT + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const adminLocked = () => !CLOUD && !ls.get('sp.adminTrusted', false);
function showPinForm() {
  const has = !!ls.get('sp.adminPin', null);
  $('#pinLabel').textContent = has ? 'Enter your admin PIN' : 'Create an admin PIN (4–8 digits)';
  $('#pin2').hidden = has; $('#pin2').required = !has;
  $('#pinBtn').textContent = has ? 'Unlock' : 'Create PIN';
  $('#pin').value = $('#pin2').value = ''; $('#pinErr').textContent = '';
  $('#pinForm').hidden = false; $('#pin').focus();
}
$('#pinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pin = $('#pin').value.trim(), stored = ls.get('sp.adminPin', null), fail = msg => {
    $('#pinErr').textContent = msg; const f = $('#pinForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  };
  if (!/^\d{4,8}$/.test(pin)) return fail('Use 4 to 8 digits');
  if (!stored) {
    if (pin !== $('#pin2').value.trim()) return fail('The two PINs don’t match');
    ls.set('sp.adminPin', await pinHash(pin));
    toast('Admin PIN created 🔒');
  } else if (await pinHash(pin) !== stored) { $('#pin').value = ''; return fail('Wrong PIN'); }
  ls.set('sp.adminTrusted', true);
  $('#pinForm').hidden = true;
  enterApp(ADMIN);
});
function showLogin() {
  $('#splash').hidden = true;
  $('#installLink').hidden = !canInstall();
  $('#app').hidden = true; $('#login').hidden = false; Peony.show(false);
  $('#modeNote').textContent = CLOUD ? 'Synced between both phones.' : 'Saved on this device only, so phones don’t sync yet.';
}
function enterApp(user) {
  S.me = S.viewing = user;
  ls.set('sp.me', user);
  $('#splash').hidden = true;
  $('#login').hidden = true; $('#app').hidden = false;
  Peony.show(user === 'zhra');
  switchTab(ls.get('sp.tab', 'today'));
}
function logout() {
  if (CLOUD) { CloudBackend.stop(); firebase.auth().signOut(); }
  if (S.me === ADMIN) ls.set('sp.adminTrusted', false);   // next time the Hussein profile needs the PIN again
  ls.set('sp.me', null); S.me = null; pickedUser = null;
  $('#pinForm').hidden = true;
  $$('.who button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  $('#pwForm').hidden = true;
  showLogin();
}

$$('.who button').forEach(b => b.addEventListener('click', () => {
  pickedUser = b.dataset.user;
  $$('.who button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#pinForm').hidden = true;
  // Press animation: the peony photo spins and sheds petals; the bottle does a "cheers" tilt.
  b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
  const r = $('.av', b).getBoundingClientRect();
  if (pickedUser === 'zhra') burst(r.left + r.width / 2, r.top + r.height / 2, 22);
  else burst(r.left + r.width / 2, r.top + r.height / 3, 14, ['#cfe8f7', '#ffffff', '#9cc0d8', '#c8102e']);
  if (!CLOUD && pickedUser === ADMIN && adminLocked()) { setTimeout(() => b.classList.remove('go'), 900); return showPinForm(); }
  if (!CLOUD) return setTimeout(() => { b.classList.remove('go'); enterApp(pickedUser); }, reduceMotion ? 0 : 750);
  setTimeout(() => b.classList.remove('go'), 900);
  $('#pwForm').hidden = false; $('#loginErr').textContent = ''; $('#pw').focus();
}));

$('#pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!pickedUser) return;
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try { await firebase.auth().signInWithEmailAndPassword(USERS[pickedUser].email, $('#pw').value); $('#pw').value = ''; }
  catch (err) { $('#loginErr').textContent = /password|credential|user/i.test(err.code || '') ? 'Wrong password' : err.message; }
  finally { $('#loginBtn').disabled = false; }
});

const loadScript = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.append(s); });

async function boot() {
  if (!CLOUD) {
    Backend = LocalBackend; LocalBackend.start();
    const me = ls.get('sp.me', null);
    return USERS[me] && !(me === ADMIN && adminLocked()) ? enterApp(me) : showLogin();
  }
  const v = '10.14.1', base = `https://www.gstatic.com/firebasejs/${v}/`;
  try {
    await loadScript(base + 'firebase-app-compat.js');
    await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
  } catch { document.body.innerHTML = '<p style="padding:24px">Could not load Firebase. Check your connection and reload.</p>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  // Offline cache: taps update instantly and sync in the background.
  await db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  CloudBackend.db = db; Backend = CloudBackend;
  firebase.auth().onAuthStateChanged(user => {
    if (!user) return showLogin();
    const key = Object.keys(USERS).find(k => USERS[k].email.toLowerCase() === (user.email || '').toLowerCase());
    if (!key) { firebase.auth().signOut(); return toast('This account is not allowed'); }
    CloudBackend.start(); enterApp(key);
  });
}
boot();
</script>
